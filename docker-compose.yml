services:
  metatrader5:
    build: .
    image: metatrader5-vnc:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - CUSTOM_USER=${CUSTOM_USER}
      - PASSWORD=${PASSWORD}
      - MT5_WATCHDOG_INTERVAL=${MT5_WATCHDOG_INTERVAL:-60}
    volumes:
      - mt5-data:/config
    restart: unless-stopped

volumes:
  mt5-data:
