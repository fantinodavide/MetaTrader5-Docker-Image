services:
  metatrader5:
    build: .
    # Wine uses the hostname as the Windows computer name, and MT5 ties saved
    # logins to it. Docker gives each new container a random one.
    hostname: metatrader5
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - CUSTOM_USER=${CUSTOM_USER:-}
      - PASSWORD=${PASSWORD:-}
      - TITLE=${TITLE:-MetaTrader 5}
      - SELKIES_SCALING_DPI=${SELKIES_SCALING_DPI:-96}
      - MT5_WATCHDOG_INTERVAL=${MT5_WATCHDOG_INTERVAL:-}
      - MT5_CMD_OPTIONS=${MT5_CMD_OPTIONS:-}
    # MetaTrader 5 deletes its saved accounts "due security reason" when a
    # network adapter's MAC changes, and Docker assigns new ones on every start.
    networks:
      default:
        # Each compose project has its own default network: no clash.
        mac_address: "02:00:00:4d:54:35"
      dokploy-network:
        # Shared by all Dokploy apps: every instance needs its own value.
        mac_address: ${MT5_MAC_ADDRESS:?set MT5_MAC_ADDRESS to a MAC unique to this instance, e.g. 02:00:00:4d:35:01}
    volumes:
      - mt5-data:/config
    restart: unless-stopped
    # Time for MetaTrader 5 to save and close before Docker kills it
    stop_grace_period: 1m

networks:
  dokploy-network:
    external: true

volumes:
  mt5-data:
