services:
  metatrader5:
    build: .
    image: metatrader5-vnc:latest
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - CUSTOM_USER=${CUSTOM_USER:-}
      - PASSWORD=${PASSWORD:-}
      - TITLE=${TITLE:-MetaTrader 5}
      - MT5_WATCHDOG_INTERVAL=${MT5_WATCHDOG_INTERVAL:-}
      - MT5_CMD_OPTIONS=${MT5_CMD_OPTIONS:-}
    volumes:
      - ./config:/config
    restart: unless-stopped
